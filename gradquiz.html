<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/logo_26.png">
  <link rel="apple-touch-icon" href="assets/logo_26.png">

  <!-- CRITICAL: This viewport meta tag is essential for mobile -->
  <!-- Multiple viewport declarations to maximize compatibility across browsers/webviews -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
  
  <!-- Telegram-specific meta tags -->
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>What Tool Are You? - DID GRADSHOW 2026</title>

  <!-- Inter Tight Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Prevent scrolling on mobile */
      position: fixed; /* Prevent bounce/overscroll on iOS */
      -webkit-overflow-scrolling: touch;
    }
    
    body {
      margin: 0;
      padding: 0;
      /* Prevent text selection and callouts on mobile */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    canvas {
      display: block;
      /* Prevent touch gestures on canvas */
      touch-action: none;
      -ms-touch-action: none;
    }

    /* Share fallback (desktop / unsupported file share) */
    .quiz-share-fallback {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      font-family: "Inter Tight", system-ui, sans-serif;
    }

    .quiz-share-fallback[hidden] {
      display: none !important;
    }

    .quiz-share-fallback__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(41, 18, 76, 0.45);
    }

    .quiz-share-fallback__panel {
      position: relative;
      width: min(100%, 22rem);
      max-height: min(90vh, 28rem);
      overflow: auto;
      background: #fdf7ff;
      border: 1px solid rgba(41, 18, 76, 0.14);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(41, 18, 76, 0.18);
      padding: 1.25rem 1rem 1rem;
      color: #29124c;
    }

    .quiz-share-fallback__close {
      position: absolute;
      top: 0.5rem;
      right: 0.65rem;
      border: none;
      background: none;
      font-size: 1.5rem;
      line-height: 1;
      color: #29124c;
      cursor: pointer;
      padding: 0.25rem;
    }

    .quiz-share-fallback__title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin: 0 1.5rem 0.35rem 0;
    }

    .quiz-share-fallback__hint {
      font-size: 0.82rem;
      line-height: 1.45;
      margin: 0 0 0.85rem;
      opacity: 0.88;
    }

    .quiz-share-menu {
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(41, 18, 76, 0.12);
      border-radius: 6px;
      overflow: hidden;
      background: #fdf7ff;
    }

    .quiz-share-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: #29124c;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      transition: background 0.15s ease;
      box-sizing: border-box;
    }

    .quiz-share-item + .quiz-share-item {
      border-top: 1px solid rgba(41, 18, 76, 0.1);
    }

    .quiz-share-item--more {
      margin-top: 0;
    }

    .quiz-share-item:hover,
    .quiz-share-item:focus-visible {
      background: rgba(41, 18, 76, 0.07);
      outline: none;
    }

    .quiz-share-icon-wrap {
      flex-shrink: 0;
      width: 1.25rem;
      height: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #29124c;
    }

    .quiz-share-icon-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .quiz-share-label {
      flex: 1;
      min-width: 0;
    }
  </style>
  
  <script>
    // Force viewport scale for Telegram and other webviews
    // This runs before p5.js to ensure proper scaling
    (function() {
      // Remove any existing viewport tags and re-add with correct settings
      function setViewport() {
        var viewports = document.querySelectorAll('meta[name="viewport"]');
        viewports.forEach(function(vp) { vp.remove(); });
        
        var viewport = document.createElement('meta');
        viewport.name = "viewport";
        viewport.content = "width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover";
        document.head.appendChild(viewport);
      }
      
      // Set on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setViewport);
      } else {
        setViewport();
      }
      
      // Prevent zoom on double-tap (iOS/Telegram)
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
      
      // Force window size update (helps Telegram WebView)
      window.addEventListener('resize', function() {
        setTimeout(function() {
          window.scrollTo(0, 0);
        }, 100);
      });
    })();
  </script>
</head>
